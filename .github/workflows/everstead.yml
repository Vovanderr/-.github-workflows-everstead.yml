name: Everstead Voice Lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare the experiment runner
        id: prepare
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/everstead.py" <<'PY'
          """Launch the Colab pipeline in order without relying on notebook kernel state."""
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import traceback

          QWEN_SOURCE = ("qwen-tts @ git+https://github.com/QwenLM/Qwen3-TTS.git"
                         "@022e286b98fbec7e1e916cb940cdf532cd9f488e")
          QWEN_REQUIREMENTS = [
              "transformers==4.57.3", "accelerate==1.12.0", "huggingface-hub==0.36.0",
              "librosa>=0.10.2,<0.12", "soundfile>=0.12,<0.15", "sox", "onnxruntime", "einops",
          ]
          AUDIO8_REQUIREMENTS = ["mlx[cpu]==0.32.5", "mlx-audio==0.6.8", "soundfile>=0.12,<0.15"]
          DEVICE_PROBE = (
              "import torch; "
              "device = torch.cuda.get_device_name() if torch.cuda.is_available() else 'CPU (CUDA недоступна)'; "
              "print('Устройство', device, '| PyTorch', torch.__version__)"
          )
          QWEN_PROBE = (
              "import torchaudio; from qwen_tts import Qwen3TTSModel; "
              "print('Qwen API готов')"
          )
          AUDIO8_PROBE = (
              "import mlx.core as mx; from mlx_audio.tts.models.arktts import Model; "
              "mx.set_default_device(mx.cpu); mx.eval(mx.ones((2,2))); print('Audio8 MLX CPU готов')"
          )


          class StepFailed(RuntimeError):
              def __init__(self, message, *, invalid_probabilities=False):
                  super().__init__(message)
                  self.invalid_probabilities = invalid_probabilities


          def run_command(label, args, log_path, env=None):
              print(f"\n▶ {label}", flush=True)
              invalid_probabilities = False
              with log_path.open("a", encoding="utf-8") as log:
                  log.write(f"\n▶ {label}\n")
                  with subprocess.Popen([str(arg) for arg in args], env=env, stdout=subprocess.PIPE,
                                        stderr=subprocess.STDOUT, text=True, errors="replace",
                                        bufsize=1) as process:
                      try:
                          for line in process.stdout:
                              if "probability tensor contains" in line.lower():
                                  invalid_probabilities = True
                              print(line, end="", flush=True)
                              log.write(line)
                              log.flush()
                      except KeyboardInterrupt:
                          process.terminate()
                          raise
                      status = process.wait()
                  if status:
                      raise StepFailed(f"{label} — код {status}. Первая ошибка находится выше. "
                                       f"Полный журнал: {log_path}.",
                                       invalid_probabilities=invalid_probabilities)


          def has_local_pip(python):
              if not python.is_file():
                  return False
              probe = ("from pathlib import Path; import pip, sys; "
                       "assert Path(pip.__file__).is_relative_to(Path(sys.prefix))")
              return subprocess.run([str(python), "-c", probe],
                                    stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0


          def ensure_environment(root, name, log, inherit_system):
              home = root / name
              python = home / "bin" / "python"
              if has_local_pip(python):
                  return python

              options = ["--system-site-packages"] if inherit_system else []
              try:
                  run_command(f"{name} · создание окружения", [sys.executable, "-m", "venv", *options, home], log)
              except StepFailed:
                  print("Стандартный venv не подготовил pip. Использую virtualenv из PyPI.", flush=True)
              if not has_local_pip(python):
                  bootstrap = root / "_bootstrap"
                  run_command("Установка virtualenv",
                              [sys.executable, "-m", "pip", "install", "--disable-pip-version-check",
                               "--target", bootstrap, "virtualenv==20.36.1"], log)
                  env = os.environ.copy()
                  env["PYTHONPATH"] = os.pathsep.join(filter(None, [str(bootstrap), env.get("PYTHONPATH")]))
                  run_command(f"{name} · создание через virtualenv",
                              [sys.executable, "-m", "virtualenv", "--no-download", "--no-periodic-update",
                               "--app-data", root / "_virtualenv-data", *options, home], log, env=env)
              if not has_local_pip(python):
                  raise RuntimeError(f"Модуль pip не появился в {home}. См. журнал {log}.")
              return python


          def setup(root, name, requirements, probe, log, *, inherit_system=False, source=None):
              python = ensure_environment(root, name, log, inherit_system)
              marker = root / name / "everstead-dependencies.json"
              configuration = [requirements, source]
              try:
                  different = json.loads(marker.read_text(encoding="utf-8")) != configuration
              except (FileNotFoundError, ValueError):
                  different = True
              if different:
                  pip = [python, "-m", "pip", "install", "--disable-pip-version-check", "--progress-bar", "off"]
                  run_command(f"{name} · зависимости", [*pip, *requirements], log)
                  if source:
                      run_command(f"{name} · код Qwen", [*pip, "--no-deps", source], log)
              run_command(f"{name} · проверка импорта", [python, "-c", probe], log)
              marker.write_text(json.dumps(configuration), encoding="utf-8")
              return python


          def run_experiment(root, data, batch_source):
              root.mkdir(parents=True, exist_ok=True)
              log = root / "run.log"
              (root / "experiment.json").write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
              runner = root / "batch.py"
              runner.write_text(batch_source, encoding="utf-8")
              with log.open("a", encoding="utf-8") as stream:
                  stream.write("\n=== Новый запуск Everstead Voice Lab ===\n")
              try:
                  if sys.version_info < (3, 11):
                      raise RuntimeError("Требуется среда Colab с Python 3.11 или новее.")
                  if shutil.which("ffmpeg") is None:
                      raise RuntimeError("В среде отсутствует FFmpeg для MP3.")
                  run_command("Выбор устройства", [sys.executable, "-c", DEVICE_PROBE], log)
                  qwen = setup(root, "qwen-runtime", QWEN_REQUIREMENTS, QWEN_PROBE, log,
                               inherit_system=True, source=QWEN_SOURCE)
                  run_command("1 из 4 · Qwen VoiceDesign", [qwen, "-u", runner, root, "design"], log)
                  base_command = [qwen, "-u", runner, root, "base"]
                  try:
                      run_command("2 из 4 · Qwen Base 0.6B", base_command, log)
                  except StepFailed as exc:
                      if not exc.invalid_probabilities:
                          raise
                      run_command("2 из 4 · Повтор Qwen Base в FP32 без случайного выбора токенов",
                                  [*base_command, "--base-greedy"], log)
                  audio8 = setup(root, "audio8-runtime", AUDIO8_REQUIREMENTS, AUDIO8_PROBE, log)
                  run_command("3 из 4 · Audio8 Realistic 0.6B", [audio8, "-u", runner, root, "audio8"], log)
                  run_command("4 из 4 · Проверка MP3 и сборка ZIP", [sys.executable, "-u", runner, root, "pack"], log)
              except Exception as exc:
                  with log.open("a", encoding="utf-8") as stream:
                      stream.write(traceback.format_exc())
                  print(f"\nОстановлено. {exc}\nЖурнал: {log}", flush=True)
                  raise
              return root / "Everstead-Voice-Lab-MP3.zip"

          """Save notebook results as Kaggle version artifacts."""
          from datetime import datetime, timezone
          import hashlib
          import json
          import shutil
          from zipfile import ZipFile


          def partial_zip(work, output):
              listening = work / "listening"
              tracks = []
              for mp3 in sorted(listening.rglob("*.mp3")):
                  sidecar = mp3.with_suffix(".json")
                  if mp3.name.endswith(".tmp.mp3") or not sidecar.is_file():
                      continue
                  try:
                      record = json.loads(sidecar.read_text(encoding="utf-8"))
                  except ValueError:
                      continue
                  digest = hashlib.sha256(mp3.read_bytes()).hexdigest()
                  if digest == record.get("mp3_sha256"):
                      tracks.append((mp3, {**record, "file": mp3.relative_to(listening).as_posix()}))
              if not tracks:
                  return None, 0

              archive = output / f"Everstead-partial-{len(tracks)}-MP3.zip"
              temp = archive.with_suffix(".tmp.zip")
              with ZipFile(temp, "w") as bundle:
                  for mp3, record in tracks:
                      bundle.write(mp3, record["file"])
                  bundle.writestr("provenance.json", json.dumps([r for _, r in tracks], ensure_ascii=False, indent=2))
                  bundle.writestr("СТАТУС.txt", "Частичный набор. В архив вошли проверенные готовые MP3.\n")
              temp.replace(archive)
              return archive, len(tracks)


          def save_version_outputs(work, output, experiment, batch_source, run_experiment):
              output.mkdir(parents=True, exist_ok=True)
              expected = len(experiment["voices"]) * (1 + 2 * len(experiment["phrases"]))
              error = None
              try:
                  prepared = run_experiment(work, experiment, batch_source)
                  target = output / prepared.name
                  staging = target.with_suffix(".tmp.zip")
                  shutil.copyfile(prepared, staging)
                  staging.replace(target)
                  count = expected
              except Exception as exc:
                  error = str(exc)
                  print(f"Синтез прерван. {error}", flush=True)
                  target, count = partial_zip(work, output)

              log = work / "run.log"
              if log.is_file():
                  shutil.copyfile(log, output / "Everstead-run.log")
              status = {
                  "complete": error is None,
                  "tracks": count,
                  "expected_tracks": expected,
                  "archive": target.name if target else None,
                  "error": error,
                  "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              }
              (output / "Everstead-status.json").write_text(
                  json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
              )
              if target:
                  print(f"ZIP сохранён в Output. {count} из {expected} MP3 · {target.name}")
              else:
                  print("ZIP пока отсутствует. В Output сохранён статус запуска.")
              return status

          runner = Path(os.environ["RUNNER_TEMP"])
          work = runner / "everstead-work"
          output = runner / "everstead-results"
          experiment = {'voices': [{'id': 'M1', 'name': 'Кедр', 'voice': 'мужской', 'description': 'Низкий баритон, тёплый и спокойный', 'instruct': 'Adult male Russian speaker, low warm baritone with rounded vowels and gentle consonants. Calm conversational pace, clear unstaged questions, soft sentence endings. A dry close microphone, neutral Russian pronunciation.'}, {'id': 'M2', 'name': 'Лён', 'voice': 'мужской', 'description': 'Лёгкий средний тенор, внимательный', 'instruct': 'Adult male Russian speaker, light middle tenor with clear resonance, nimble consonants and small pitch movements. Engaged, reassuring and conversational, with a clear questioning contour. Neutral Russian pronunciation and a dry close microphone.'}, {'id': 'M3', 'name': 'Кремень', 'voice': 'мужской', 'description': 'Средний баритон, собранный и сухой', 'instruct': 'Adult male Russian speaker, centered mid baritone, slightly dry grain and precise articulation. Deliberate rhythm, restrained emotions, relaxed unhurried endings. Native neutral Russian pronunciation, intimate clean recording.'}, {'id': 'F1', 'name': 'Маяк', 'voice': 'женский', 'description': 'Светлый средний голос, отзывчивый', 'instruct': 'Adult female Russian speaker, bright clear mid-range with soft resonance and light articulation. Warm, engaged, with restrained liveliness and naturally rising questions. Close dry microphone, neutral standard Russian pronunciation.'}, {'id': 'F2', 'name': 'Ива', 'voice': 'женский', 'description': 'Низкий мягкий альт, неспешный', 'instruct': 'Adult female Russian speaker, low warm alto with rounded vowels and an even, relaxed tempo. Quiet confidence, gentle sentence transitions and slightly wider pitch on questions. Clean dry recording, neutral Russian pronunciation.'}, {'id': 'F3', 'name': 'Искра', 'voice': 'женский', 'description': 'Высокая собранная середина, подвижный', 'instruct': 'Adult female Russian speaker, clear higher middle range, precise consonants and quick, smooth shifts in melody. Friendly and curious with measured emphasis. A natural neutral Russian accent and a dry close microphone.'}], 'anchor': 'Ну что, начнём? Отлично. План уже готов, осталось обсудить детали.', 'seed': 42, 'phrases': [{'id': 'questions', 'topic': 'вопросы', 'text': 'Ты уже оплатил счёт? А когда будет следующий платёж?', 'check': 'Различимы общий и специальный вопросы.'}], 'transcript_overrides': {}}
          batch_source = '"""Batch Qwen VoiceDesign and two reference-conditioned Russian TTS engines."""\nimport argparse\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport subprocess\nfrom time import perf_counter\nimport zipfile\n\nMODEL_IDS = {\n    "design": "Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign",\n    "base": "Qwen/Qwen3-TTS-12Hz-0.6B-Base",\n    "audio8": "nativ-community/Audio8-TTS-Realistic-0.6b-bf16",\n}\nLABELS = {\n    "design": "01_Qwen_VoiceDesign",\n    "base": "02_Qwen_Base_0.6B",\n    "audio8": "03_Audio8_Realistic_0.6B",\n}\nMODEL_FILES = ["*.safetensors", "*.json", "*.txt", "*.model", "*.tiktoken", "*.jinja",\n               "README.md", "LICENSE*", "NOTICE*"]\n\n\ndef load_json(path):\n    return json.loads(path.read_text(encoding="utf-8"))\n\n\ndef json_file(path, value):\n    temp = path.with_suffix(".tmp.json")\n    temp.write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")\n    temp.replace(path)\n\n\ndef digest(path):\n    with path.open("rb") as stream:\n        return hashlib.file_digest(stream, "sha256").hexdigest()\n\n\ndef model_revisions(root):\n    lock = root / "model_revisions.json"\n    return load_json(lock) if lock.is_file() else {}\n\n\ndef model_snapshot(root, stage):\n    from huggingface_hub import HfApi, snapshot_download\n\n    lock = root / "model_revisions.json"\n    revisions = model_revisions(root)\n    repo = MODEL_IDS[stage]\n    revision = revisions.get(repo)\n    try:\n        if not revision:\n            revision = HfApi().model_info(repo, token=False).sha\n            if len(revision or "") != 40:\n                raise RuntimeError(f"No exact revision for public model {repo}")\n            json_file(lock, {**revisions, repo: revision})\n        path = snapshot_download(repo_id=repo, revision=revision, token=False,\n                                 allow_patterns=MODEL_FILES, max_workers=4,\n                                 cache_dir=root / "hf-cache")\n    except Exception as ex:\n        raise RuntimeError(f"Не удалось скачать публичные веса {repo} ({type(ex).__name__}). "\n                           "Проверьте доступ Hugging Face из Colab и свободное место.") from ex\n    return path, revision\n\n\ndef output(root, stage, voice, phrase_id):\n    path = root / "listening" / LABELS[stage] / voice\n    return path / f"{phrase_id}.wav", path / f"{phrase_id}.mp3", path / f"{phrase_id}.json"\n\n\ndef committed(out, fields):\n    wav, mp3, sidecar = out\n    if not all(path.is_file() for path in out):\n        return False\n    record = load_json(sidecar)\n    return (all(record.get(key) == value for key, value in fields.items())\n            and record.get("wav_sha256") == digest(wav)\n            and record.get("mp3_sha256") == digest(mp3))\n\n\ndef save(out, fields, samples, sample_rate, elapsed):\n    import numpy as np\n    import soundfile as sf\n\n    waveform = np.asarray(samples, dtype=np.float32)\n    if (waveform.ndim != 1 or sample_rate <= 0 or len(waveform) < sample_rate // 2\n            or not np.isfinite(waveform).all() or np.max(np.abs(waveform)) < 0.002):\n        raise RuntimeError(f"Звук отсутствует или повреждён: {out[0].name}")\n    wav, mp3, sidecar = out\n    wav.parent.mkdir(parents=True, exist_ok=True)\n    wav_temp = wav.with_suffix(".tmp.wav")\n    mp3_temp = mp3.with_suffix(".tmp.mp3")\n    sf.write(wav_temp, np.clip(waveform, -1, 1), int(sample_rate), subtype="PCM_16")\n    subprocess.run(["ffmpeg", "-nostdin", "-v", "error", "-y", "-i", str(wav_temp),\n                    "-codec:a", "libmp3lame", "-ac", "1", "-ar", "44100", "-b:a", "128k",\n                    str(mp3_temp)], check=True)\n    wav_temp.replace(wav)\n    mp3_temp.replace(mp3)\n    duration = len(waveform) / sample_rate\n    json_file(sidecar, {**fields, "native_sample_rate": int(sample_rate), "audio_seconds": duration,\n                        "seconds_to_waveform": elapsed, "rtf": elapsed / duration,\n                        "wav_sha256": digest(wav), "mp3_sha256": digest(mp3)})\n    print(f"{wav.parent.parent.name}/{wav.parent.name}/{wav.stem}: {duration:.1f} с · RTF {elapsed/duration:.2f}", flush=True)\n\n\ndef tasks(root, stage, data, revision):\n    for i, voice in enumerate(data["voices"]):\n        voice_id = voice["id"]\n        reference = output(root, "design", voice_id, "reference")\n        if stage == "design":\n            phrases = [{"id": "reference", "text": data["anchor"]}]\n            ref_sha = None\n            ref_text = None\n        else:\n            if not committed(reference, {"engine": "design", "voice": voice_id, "text": data["anchor"],\n                                         "instruct": voice["instruct"], "seed": data["seed"] + i}):\n                raise RuntimeError(f"Отсутствует проверенный референс Qwen VoiceDesign для {voice_id}.")\n            phrases = data["phrases"]\n            ref_sha = digest(reference[0])\n            ref_text = data["transcript_overrides"].get(voice_id, data["anchor"])\n        for phrase in phrases:\n            out = output(root, stage, voice_id, phrase["id"])\n            fields = {\n                "engine": stage, "model": MODEL_IDS[stage], "revision": revision,\n                "voice": voice_id, "voice_name": voice["name"], "text": phrase["text"],\n                "phrase": phrase["id"], "seed": data["seed"] + i, "language": "Russian",\n                "instruct": voice["instruct"] if stage == "design" else None,\n                "reference_wav_sha256": ref_sha, "reference_text": ref_text,\n            }\n            if not committed(out, fields):\n                yield out, fields, reference[0]\n\n\ndef synth_qwen(model_path, stage, queue, *, base_greedy=False):\n    import torch\n    from qwen_tts import Qwen3TTSModel\n\n    cuda = torch.cuda.is_available()\n    has_bf16 = cuda and torch.cuda.get_device_capability()[0] >= 8\n    # T4 does not have native BF16. Keep the Base speaker encoder and decoder in\n    # FP32 on this GPU instead of the FP16 path that produced invalid probabilities.\n    use_fp32 = not cuda or (stage == "base" and (not has_bf16 or base_greedy))\n    dtype = torch.float32 if use_fp32 else (torch.bfloat16 if has_bf16 else torch.float16)\n    attention = "eager" if cuda and use_fp32 else "sdpa"\n    device = torch.cuda.get_device_name() if cuda else "CPU"\n    if not cuda:\n        torch.set_num_threads(min(4, os.cpu_count() or 1))\n    print(f"Qwen {stage} · {device} · {dtype} · {attention} · "\n          f"{\'greedy\' if base_greedy else \'default sampling\'}", flush=True)\n    model = Qwen3TTSModel.from_pretrained(model_path, device_map="cuda:0" if cuda else "cpu", dtype=dtype,\n                                          attn_implementation=attention, local_files_only=True)\n    languages = model.get_supported_languages()\n    if languages and "russian" not in {value.lower() for value in languages}:\n        raise RuntimeError("Выбранные веса не заявляют русский язык.")\n    decoding = {"do_sample": False, "subtalker_dosample": False,\n                "top_k": 0, "temperature": 1.0, "top_p": 1.0,\n                "subtalker_top_k": 0, "subtalker_temperature": 1.0,\n                "subtalker_top_p": 1.0} if base_greedy else {}\n    prompts = {}\n    for out, meta, reference in queue:\n        torch.manual_seed(meta["seed"])\n        if stage == "base" and reference not in prompts:\n            prompt = model.create_voice_clone_prompt(\n                ref_audio=str(reference), ref_text=meta["reference_text"], x_vector_only_mode=False)\n            if not all(torch.isfinite(item.ref_spk_embedding).all().item() for item in prompt):\n                raise RuntimeError(f"Qwen Base вернул неконечные параметры голоса {meta[\'voice\']}.")\n            prompts[reference] = prompt\n        if cuda:\n            torch.cuda.synchronize()\n        start = perf_counter()\n        if stage == "design":\n            wavs, sample_rate = model.generate_voice_design(\n                text=meta["text"], language="Russian", instruct=meta["instruct"], max_new_tokens=512)\n        else:\n            wavs, sample_rate = model.generate_voice_clone(\n                text=meta["text"], language="Russian", voice_clone_prompt=prompts[reference],\n                non_streaming_mode=True, max_new_tokens=512, **decoding)\n        if cuda:\n            torch.cuda.synchronize()\n        save(out, {**meta, "device": device, "dtype": str(dtype),\n                   "decode_mode": "greedy" if base_greedy else "default", "attention": attention},\n             wavs[0], sample_rate, perf_counter() - start)\n\n\ndef synth_audio8(model_path, queue):\n    import mlx.core as mx\n    import numpy as np\n    from mlx_audio.tts.utils import load\n\n    mx.set_default_device(mx.cpu)\n    model = load(model_path)\n    for out, meta, reference in queue:\n        start = perf_counter()\n        generated = next(model.generate(text=meta["text"], ref_audio=str(reference),\n                                        ref_text=meta["reference_text"], seed=meta["seed"],\n                                        temperature=0.8, top_p=0.95, max_tokens=384))\n        samples = np.asarray(generated.audio.astype(mx.float32))\n        save(out, {**meta, "device": "MLX Linux CPU", "dtype": "BF16 checkpoint"},\n             samples, generated.sample_rate, perf_counter() - start)\n\n\ndef synth(root, stage, data, *, base_greedy=False):\n    known_revision = model_revisions(root).get(MODEL_IDS[stage])\n    if known_revision and not list(tasks(root, stage, data, known_revision)):\n        print(f"{LABELS[stage]}: все файлы на месте и совпадают по SHA-256.")\n        return\n    path, revision = model_snapshot(root, stage)\n    queue = list(tasks(root, stage, data, revision))\n    if not queue:\n        print(f"{LABELS[stage]}: все файлы на месте и совпадают по SHA-256.")\n        return\n    print(f"{LABELS[stage]}: осталось {len(queue)} записей, модель {MODEL_IDS[stage]} @ {revision}", flush=True)\n    os.environ["HF_HUB_OFFLINE"] = "1"\n    os.environ["TRANSFORMERS_OFFLINE"] = "1"\n    if stage == "audio8":\n        synth_audio8(path, queue)\n    else:\n        synth_qwen(path, stage, queue, base_greedy=base_greedy)\n\n\ndef package(root, data):\n    revisions = model_revisions(root)\n    expected = 6 * (1 + 2 * len(data["phrases"]))\n    entries = []\n    for stage in MODEL_IDS:\n        revision = revisions[MODEL_IDS[stage]]\n        missing = list(tasks(root, stage, data, revision))\n        if missing:\n            raise RuntimeError(f"Для {LABELS[stage]} нужно закончить {len(missing)} файлов. ZIP не создан.")\n        for voice in data["voices"]:\n            ids = ["reference"] if stage == "design" else [p["id"] for p in data["phrases"]]\n            for pid in ids:\n                _, mp3, sidecar = output(root, stage, voice["id"], pid)\n                subprocess.run(["ffmpeg", "-nostdin", "-v", "error", "-i", str(mp3),\n                                "-f", "null", "-"], check=True)\n                record = load_json(sidecar)\n                record["file"] = mp3.relative_to(root / "listening").as_posix()\n                entries.append((mp3, record))\n    if len(entries) != expected:\n        raise RuntimeError("Число прошедших проверку MP3 расходится с матрицей эксперимента.")\n    target = root / "Everstead-Voice-Lab-MP3.zip"\n    temp = target.with_suffix(".tmp.zip")\n    with zipfile.ZipFile(temp, "w", compression=zipfile.ZIP_DEFLATED) as archive:\n        for audio, record in entries:\n            archive.write(audio, record["file"])\n        archive.writestr("provenance.json", json.dumps([r for _, r in entries], ensure_ascii=False, indent=2))\n        archive.writestr("КАК-СЛУШАТЬ.txt",\n                         "01 — шесть референсов Qwen VoiceDesign. "\n                         "02 и 03 — одни и те же новые фразы Qwen Base и Audio8 на каждом из шести голосов. "\n                         "Сохранение тембра и естественность оцениваются при прослушивании.\\n")\n    temp.replace(target)\n    print(f"Готово: {expected} MP3 · {target}", flush=True)\n    return target\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument("root", type=Path)\n    parser.add_argument("stage", choices=(*MODEL_IDS, "pack"))\n    parser.add_argument("--base-greedy", action="store_true")\n    args = parser.parse_args()\n    if args.base_greedy and args.stage != "base":\n        parser.error("--base-greedy requires the base stage")\n    data = load_json(args.root / "experiment.json")\n    if len(data["voices"]) != 6 or not data["phrases"]:\n        raise RuntimeError("Ожидаются шесть голосов и хотя бы одна общая реплика.")\n    if args.stage == "pack":\n        package(args.root, data)\n    else:\n        synth(args.root, args.stage, data, base_greedy=args.base_greedy)\n\n\nif __name__ == "__main__":\n    main()\n'

