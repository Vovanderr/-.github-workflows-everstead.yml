      - name: Prepare the CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v sox >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg sox
          fi
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
      - name: Generate and verify 18 MP3
        id: synth
        shell: bash
        env:
          PIP_NO_CACHE_DIR: '1'
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
        run: python "$RUNNER_TEMP/everstead.py" synth
      - name: Collect completed MP3 and run log
        id: collect
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        shell: bash
        env:
          SYNTH_OUTCOME: ${{ steps.synth.outcome }}
        run: python "$RUNNER_TEMP/everstead.py" collect
      - name: Upload the MP3 and run log
        if: ${{ always() && steps.collect.outputs.artifact_name != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.collect.outputs.artifact_name }}
          path: ${{ runner.temp }}/everstead-results/
          if-no-files-found: error
          retention-days: 7
